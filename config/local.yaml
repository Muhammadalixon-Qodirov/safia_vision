# Local test config: the CCTV clips the applicant collected, run together
# (multi-stream, live web page). Clip licences must be confirmed before a clip is
# used in the submission (README / GIF / measurement) - see README "Clips".
# For MEASUREMENT run a clip on its own with realtime: false (every frame analysed);
# this file is the real-time demo, so the analysis rate is budgeted below.
#   shop1.mp4    1270x720 ~13 fps 98 s  - UK gift shop: door + two tills
#   counter2.mp4 1920x1080 30 fps 105 s - food counter with one till and a roped queue
#                (a vendor demo video with its own overlays burned in; licence unverified)
#   market.mp4   1920x1080 15 fps 299 s - supermarket, 3 checkout lanes (2 open)
# Measured budget: with 4 streams in one process (yolov8s@960, RTX 3050, live JPEGs)
# the whole service analysed ~21 frames/s in total. Asking for 13+5+5+5 = 28/s made
# shop1 and market-k2 fall to ~0.3-0.4x real time. Budget now: shop1 6.5 + 3.75 x 3
# = ~18/s, which keeps every stream at real time (see README "Speed" / scaling note).
model:
  weights: models/yolov8s.pt   # chosen on shop1 dev labels (13-config grid), see README "Model choice"
  device: 0
  imgsz: 960
  conf: 0.1                    # floor handed to ByteTrack; its own thresholds decide new tracks
  half: true
  tracker: bytetrack.yaml

output:
  dir: output_local
  live_view: true
  annotated_video: false
  blur_faces: true

alerts:
  queue:
    min_people: 3
    min_seconds: 10
  empty_counter:
    min_seconds: 15
  grace_seconds: 2

sample_hz: 1

sources:
  - name: shop1
    uri: videos/shop1.mp4
    realtime: true
    loop: true
    process_fps: 5             # 13 fps clip -> every 3rd frame (~4.3/s)
    line:                      # along the glass door's threshold, IN = moving left
      a: [1105, 450]
      b: [1035, 715]
      in_direction: [-1, 0]
      margin: 8
      commit: 30               # a crossing counts once the person is 30 px through or walks away from the door; standing on the threshold is not a crossing (README: shop1 @ 1:32)
    zones:
      queue:
        polygon: [[150, 90], [380, 90], [370, 390], [205, 400]]
      staff:
        polygon: [[30, 100], [135, 100], [185, 440], [150, 470], [60, 520]]

  - name: counter2
    uri: videos/counter2.mp4
    realtime: true
    loop: true
    process_fps: 3             # 30 fps camera: every 10th frame (3/s); queues don't need 30 fps
    line: null                 # no door in view
    zones:
      # customers stand behind the glass counter; their lower bodies are hidden, so
      # their boxes end around y 600-720. Includes the person being served at the till.
      # Passers-by in the background end above y 520 and are not counted.
      queue:
        polygon: [[380, 520], [1700, 520], [1700, 780], [380, 780]]
      # behind the till (bottom right): the cashier's box reaches the bottom edge
      staff:
        polygon: [[1480, 800], [1920, 800], [1920, 1080], [1480, 1080]]

  # market.mp4: real supermarket CCTV (2014-09-21), 1920x1080, 15 fps, 5:00, three
  # checkout lanes (lane 3 on the left is closed). ONE camera, both open tills counted
  # together: the queue zone is the two lanes, the staff zone the two cashier spots
  # (a zone may have several polygons). So "queue" = everyone waiting at either till,
  # "staff" = cashiers present (0-2), and the empty-counter alert fires only when BOTH
  # cashiers are away while someone waits. (Earlier this clip ran as two sources,
  # market-k1 / market-k2, one per till - that showed WHICH till was empty but ran the
  # detector twice on the same video.)
  - name: market
    uri: videos/market.mp4
    realtime: true
    loop: true
    process_fps: 5             # 15 fps clip -> every 3rd frame (5/s); one detector now
    line: null
    zones:
      queue:
        polygons:
          # till 1 (right lane): customers right of the belt, incl. the paying/bagging spot
          - [[1500, 60], [1900, 60], [1900, 720], [1600, 720]]
          # till 2 (middle lane): the aisle right of the middle belt
          - [[990, 40], [1250, 40], [1250, 560], [990, 560]]
      staff:
        polygons:
          # till 1: cashier stands left of the belt, incl. leaning to its end to bag
          - [[1280, 200], [1490, 200], [1570, 700], [1280, 700]]
          # till 2: seated cashier; when she leans forward her box ends near y 650-700,
          # so the zone runs to the end of her station (narrowed at the bottom so
          # customers picking up bags at the end of the belt are not taken for staff)
          - [[720, 180], [910, 180], [910, 600], [880, 760], [720, 760]]

  # cafe.mp4: crowded shop, one till, door on the right (same setup as config/cafe.yaml).
  # The crowd needs the larger model and the crowd tracker - a per-source model override.
  - name: cafe
    uri: videos/cafe.mp4
    realtime: true
    loop: true
    # Budget: 4 fps here keeps all 5 streams real time (cafe at its full 12 fps took the
    # service to 0.4x). Its door needs every frame (people cross the doorway in ~1 s),
    # so in THIS 5-stream demo cafe's door count is unreliable; the door on this clip is
    # measured with config/cafe.yaml alone (full rate). Queue and till are fine at 4 fps.
    process_fps: 4
    model:
      weights: models/yolov8m.pt
      conf: 0.05
      tracker: config/bytetrack_crowd.yaml
    line:
      a: [520, 0]
      b: [520, 480]
      in_direction: [-1, 0]
      margin: 6
    zones:
      queue:                   # see config/cafe.yaml (why count: detections)
        ref: head
        count: detections
        min_conf: 0.1
        smooth: 3
        polygon: [[50, 60], [370, 60], [370, 250], [290, 260], [290, 430], [50, 430]]
      staff:
        merge: 0.6
        polygon: [[130, 620], [640, 620], [640, 720], [130, 720]]
