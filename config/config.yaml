# One config for the whole service. Lines, zones, thresholds, sources, model,
# output — nothing is hard-coded in the code. Coordinates are in pixels of the
# source's native resolution. Edit the line/zone points to match your clips
# (use scripts/show_frame.py to grab a frame and read coordinates).

model:
  weights: models/yolov8n.pt   # downloaded by scripts/download_models.py
  device: 0                    # 0 = first GPU; "cpu" to force CPU
  imgsz: 640
  conf: 0.3
  half: true                   # FP16 on GPU (ignored on CPU)
  tracker: bytetrack.yaml      # ultralytics built-in ByteTrack

output:
  dir: output
  annotated_video: true        # write an annotated mp4 per source (for the GIF/demo)
  blur_faces: true             # blur the head region in any written frame

# alert thresholds (shared); each alert records start, end, peak and fires once
alerts:
  queue:
    min_people: 3              # N: at least this many in the queue zone
    min_seconds: 10            # T: for at least this long
  empty_counter:
    min_seconds: 15            # T: counter empty this long while someone waits
  grace_seconds: 2             # condition must fail this long before an alert ends (anti-flicker)

# sample the zones and alerts at this rate (Hz). 1 = once per video second.
sample_hz: 1

# The three clips come from config/videos.json (Pexels, free licence):
#   entrance.mp4    3840x2160  store sliding doors   -> counting line
#   counter.mp4     3840x2160  cashier counter       -> queue + staff zones
#   crowd-doors.mp4 1920x1080  crowd through doors    -> second counting line
# IMPORTANT: every coordinate below is a PLACEHOLDER scaled to the clip's native
# resolution, NOT read from the real frame. Before measuring, grab a frame
#   python scripts/show_frame.py videos/entrance.mp4 --at 5 --out entrance.jpg
# open it, read the pixel positions of the door / queue / counter, and replace
# the points. The counts and alerts are only as good as these coordinates.
sources:
  - name: entrance
    uri: videos/entrance.mp4
    realtime: true             # play the file at its real frame rate
    # door line: two endpoints [x, y]. in_direction is the movement vector that
    # counts as IN (people entering move this way). Here: downward into the store.
    line:                      # TODO verify on a real frame (3840x2160)
      a: [0, 1200]
      b: [3840, 1200]
      in_direction: [0, 1]
      margin: 6                # hysteresis band (px); raise if boxes jitter
    zones: {}

  - name: counter
    uri: videos/counter.mp4
    realtime: true
    line: null                 # no door line at the counter camera
    zones:                     # TODO verify on a real frame (3840x2160)
      queue:                   # where customers wait
        polygon: [[300, 1100], [1900, 1100], [1900, 2100], [300, 2100]]
      staff:                   # behind the till, where a cashier stands
        polygon: [[2100, 700], [3400, 700], [3400, 1700], [2100, 1700]]

  - name: crowd-doors          # second entrance stream (longest clip, 1080p)
    uri: videos/crowd-doors.mp4
    realtime: true
    line:                      # TODO verify on a real frame (1920x1080)
      a: [0, 540]
      b: [1920, 540]
      in_direction: [0, 1]
      margin: 4
    zones: {}
