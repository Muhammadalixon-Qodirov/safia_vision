# One command:  docker compose -f docker/docker-compose.yml up --build
# Mounts the config, downloaded models and videos, and the output folder.
services:
  analytics:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ../config:/app/config
      - ../models:/app/models
      - ../videos:/app/videos
      - ../output_local:/app/output_local
    ports:
      - "8010:8010"      # live page: http://localhost:8010
    environment:
      # The image is CPU-only (python:3.11-slim), but the configs ask for GPU 0.
      # This overrides every camera's model.device. CPU is slow: 4 cameras will
      # not keep real time. For GPU: delete this line, use a CUDA base image and
      # uncomment the deploy block below.
      - ANALYTICS_DEVICE=cpu
    # --- GPU (optional): needs the NVIDIA Container Toolkit on the host, and a
    # CUDA base image in the Dockerfile. Then uncomment: ---
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
